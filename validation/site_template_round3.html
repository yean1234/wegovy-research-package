/* Base styles carried over from the round-2 page. Layout: one working column — sticky header with coder + save state, tabs, one item card at a time; results as compact tables. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0f151b;--surface:#18212a;--fg:#e4eaf0;--muted:#9aa8b6;--line:#2a3643;
 --accent:#86b3e0;--accent-soft:#1e3247;--yes:#6cc79c;--yes-soft:#16342a;--no:#ec8a9b;--no-soft:#3a1d25;--warn:#e0b45e;--warn-soft:#3a2f17;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f151b;--surface:#18212a;--fg:#e4eaf0;--muted:#9aa8b6;--line:#2a3643;
 --accent:#86b3e0;--accent-soft:#1e3247;--yes:#6cc79c;--yes-soft:#16342a;--no:#ec8a9b;--no-soft:#3a1d25;--warn:#e0b45e;--warn-soft:#3a2f17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:22px;height:22px;border-radius:50%}
.save{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.save.err{background:var(--no-soft);color:var(--no)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{font:inherit;font-size:14px;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .cnt{font-family:var(--mono);font-size:11px;margin-left:6px}
main{padding-top:20px;display:grid;gap:16px}
h2{font-size:17px;margin:8px 0 0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--sans)}
.title{font-size:17px;font-weight:600;line-height:1.45;text-wrap:balance}
.excerpt{white-space:pre-wrap;font-size:14.5px;line-height:1.75;max-height:420px;overflow:auto;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.excerpt mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
a{color:var(--accent)}
.q{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.q label.qt{font-weight:600}
.q .hint{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt.y[aria-pressed="true"]{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
.opt.n[aria-pressed="true"]{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.opt kbd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
select,textarea,input{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:56px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.progress{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.pos{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pilot{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:999px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.verdict{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.verdict.ok{background:var(--yes-soft);color:var(--yes)}.verdict.mid{background:var(--warn-soft);color:var(--warn)}.verdict.bad{background:var(--no-soft);color:var(--no)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}
.rule{font-size:13px;line-height:1.65;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.rule b{color:var(--fg)}
.warnbox{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}
.step{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-right:6px}
.abstract{font-size:13.5px;line-height:1.7;max-height:440px;overflow:auto;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
@media (max-width:520px){.who span.label{display:none}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Round 3 additions (criteria v3, 2026-11-24): the article is shown whole with the lead boxed and paragraphs numbered;
   every option carries its own rule so the criterion is on the button; answers that the criteria derive are shown, not asked. */
.para{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:3px 0}
.para .pn{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:4px;text-align:right}
.leadbox{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;gap:2px}
.leadbox>.cap,.restbox>summary{font-size:12.5px;font-weight:600;color:var(--accent)}
.restbox{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.restbox>summary{cursor:pointer;color:var(--muted)}
.body{font-size:14.5px;line-height:1.75}
.body mark,.abstract mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.abstract mark.d{background:var(--accent-soft)}
.sec{margin:0 0 8px}.sec b{font-size:12.5px;letter-spacing:.02em}
.sec.bg{color:var(--muted)}
.optcol{display:grid;gap:8px}
.optcol .opt{text-align:left;display:grid;gap:2px}
.opt small{font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.45}
.opt[aria-pressed="true"] small{color:inherit;opacity:.85}
.derived{font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.derived.no{background:var(--no-soft);color:var(--no)}.derived.yes{background:var(--yes-soft);color:var(--yes)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{width:16px;height:16px;padding:0}
.fb{border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:4px}
.fb.ok{background:var(--yes-soft);color:var(--yes)}.fb.bad{background:var(--no-soft);color:var(--no)}
.fb p{color:var(--fg)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.legend{font-size:12.5px;color:var(--muted)}
</style>

 {kind:'A',id:'X1',title:'위고비 성분, 시신경 질환 위험과 연관…美 연구팀 JAMA 안과학에 발표',bundles:[{code:'NAION',ko:'비동맥염성 앞허혈시신경병증(NAION)'}],lead_n:2,paragraphs:[

  '연구팀은 신경안과 진료 환자 1만6827명의 기록을 분석했다. 과체중·비만 환자 가운데 세마글루타이드 처방군의 NAION 위험비는 7.64였다.',

 {kind:'A',id:'X5',title:"비만학회 '위고비 오남용 우려'…\"췌장염 등 부작용 살펴야\"",bundles:[{code:'PANCREATITIS',ko:'췌장염'}],lead_n:2,paragraphs:[

 {kind:'A',id:'X6',title:'위고비 맞던 50대 여성, 급성 췌장염으로 숨져…호주 방송 보도',bundles:[{code:'PANCREATITIS',ko:'췌장염'}],lead_n:2,paragraphs:[

async function flush(){

 saving=false;if(dirty)flush();
}

/* ---------- statistics (same functions as rounds 1-2; checked in validation/stat_test.js) ---------- */
function wilson(k,n,z=1.96){if(!n)return[NaN,NaN];const p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h),Math.min(1,c+h)]}
function binStats(pairs){let tp=0,fp=0,fn=0,tn=0;pairs.forEach(([r,h])=>{if(r==='yes'&&h==='yes')tp++;else if(r==='yes')fp++;else if(h==='yes')fn++;else tn++});
 const n=tp+fp+fn+tn,prec=tp+fp?tp/(tp+fp):NaN,rec=tp+fn?tp/(tp+fn):NaN;return{tp,fp,fn,tn,n,acc:n?(tp+tn)/n:NaN,prec,precCI:wilson(tp,tp+fp),rec,recCI:wilson(tp,tp+fn)}}
function pairAgree(units){let a=0,n=0;units.forEach(u=>{for(let i=0;i<u.length;i++)for(let j=i+1;j<u.length;j++){n++;if(u[i]===u[j])a++}});return n?a/n:NaN}
function krippAlpha(units){
 const o={},cats=new Set();
 units.forEach(vals=>{const m=vals.length;if(m<2)return;vals.forEach((a,i)=>vals.forEach((b,j)=>{if(i===j)return;cats.add(a);cats.add(b);o[a]=o[a]||{};o[a][b]=(o[a][b]||0)+1/(m-1)}))});
 const C=[...cats],nc=Object.fromEntries(C.map(c=>[c,C.reduce((s,k)=>s+((o[c]||{})[k]||0),0)])),n=C.reduce((s,c)=>s+nc[c],0);
 if(n<2||C.length<2)return{alpha:C.length===1&&n>=2?1:NaN,units:units.filter(u=>u.length>=2).length};
 let Do=0,De=0;C.forEach(c=>C.forEach(k=>{if(c!==k){Do+=(o[c]||{})[k]||0;De+=nc[c]*nc[k]}}));
 return{alpha:1-(n-1)*Do/De,units:units.filter(u=>u.length>=2).length};
}

const ci=c=>isFinite(c[0])?`${(c[0]*100).toFixed(1)}–${(c[1]*100).toFixed(1)}%`:'–';
const f3=x=>isFinite(x)?x.toFixed(3):'–';
function verdictAlpha(a){return !isFinite(a)?'':a>=.8?'<span class="verdict ok">채택 (α≥.800)</span>':a>=.667?'<span class="verdict mid">잠정 (.667–.800)</span>':'<span class="verdict bad">기준 수정 (&lt;.667)</span>'}
function verdictPR(x){return !isFinite(x)?'':x>.8?'<span class="verdict ok">&gt;.80</span>':'<span class="verdict bad">≤.80</span>'}

 <div class="body"><div class="leadbox"><span class="cap">제목 + 리드 (¶1–${it.lead_n}) — "연구 보도인가"는 이 상자만 보고 답합니다</span><div class="title">${hl(it.title,pats)}</div>${lead.map(para).join('')}</div></div>
 <details class="restbox body" ${restOpen?'open':''}><summary>나머지 본문 (¶${it.lead_n+1}–${it.paragraphs.length}) — 주제 판단에만 씁니다</summary>${rest.map((p,i)=>para(p,i+it.lead_n)).join('')}</details>
 ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" style="font-size:13px">원문 열기 ↗ (본문이 이상할 때만)</a>`:''}
 ${it.bundles.map(b=>`<div class="q"><label class="qt"><span class="step">주제</span>${esc(b.ko)}이(가) 이 기사의 주된 주제인가요?</label>
  <div class="optcol">${opt(field+'t:'+b.code,'main','예 — 이 부작용 하나가 기사의 주인공','제목·리드가 이 부작용 이야기이거나, 문단의 절반 이상이 이 부작용의 위험·사례·연구·소송',t[b.code],'y')}
  ${opt(field+'t:'+b.code,'list','아니오 — 부작용 여러 개를 나열하거나, 부작용 전반·오남용이 주제','이 부작용은 목록 가운데 하나',t[b.code],'n')}
  ${opt(field+'t:'+b.code,'passing','아니오 — 다른 주제(출시·가격·효능·다른 질환)이고 지나가는 언급','',t[b.code],'n')}</div></div>`).join('')}
 <div class="q"><label class="qt"><span class="step">연구 1단계</span>파란 상자 안에, 특정할 수 있는 연구의 결과가 나오나요?</label>
  <div class="optcol">${opt(field+'ls','yes','예 — 학술지·연구팀·학술대회 발표 가운데 하나 이상으로 특정되는 연구 결과가 있음','학술지 증례 보고 포함',a.ls,'y')}
  ${opt(field+'ls','no','아니오 — 상자 안에 그런 연구가 없음','상자 밖에만 나오는 연구, 학회 성명, 방송·외신 사례 보도, 규제기관 발표, "연구에 따르면"처럼 특정되지 않는 언급',a.ls,'n')}</div></div>
 ${a.ls==='yes'?`<div class="q"><label class="qt"><span class="step">연구 2단계</span>그 연구를 빼면 이 기사가 오늘 나올 이유가 사라지나요?</label>
  <div class="optcol">${opt(field+'sr','event','예 — 이 연구 결과 발표가 기사를 쓴 이유','',a.sr,'y')}
  ${opt(field+'sr','background','아니오 — 다른 사건(소송·규제·출시·사망 사례 등)이 이유이고, 연구는 설명하려고 인용','',a.sr,'n')}</div></div>`:''}
 ${d?`<div class="derived ${d.include}">기준에 따른 결과: ${it.bundles.map(b=>`${esc(b.ko)} 주제 ${d.topic[b.code]==='yes'?'예':'아니오'}`).join(' · ')} · 연구 보도 ${d.research==='yes'?'예':'아니오'}</div>`:''}`;
}
function itemView(t){
 if(!state.slot)return `<section class="card"><h2>${esc(NAME[t])}</h2><div class="warnbox">먼저 '안내' 탭에서 코더 번호를 고르세요.</div></section>`;
 const items=mine(t),i=Math.min(state.idx[t],items.length-1),it=items[i],a=ans(it.id),dc=doneCount(t);
 const nav=`<div class="navrow"><button class="btn" data-act="prev" ${i===0?'disabled':''}>← 이전</button><span class="pos">${i+1} / ${items.length}</span>
  <div class="progress"><i style="width:${dc/items.length*100}%"></i></div><span class="pos">완료 ${dc}</span><button class="btn" data-act="jump">다음 미완료</button>
  <button class="btn primary" data-act="next" ${i===items.length-1?'disabled':''}>다음 →</button></div>`;
 const extra=`<div class="q">${t==='A'?`<label class="check"><input type="checkbox" data-flag="broken" ${a.broken?'checked':''}>본문 오류 — 기사 본문이 아니거나 통째로 깨져 있음 (이 문항은 제외됩니다)</label>`:''}
  <label class="check"><input type="checkbox" data-flag="low" ${a.low?'checked':''}>확신 낮음 — 나중에 함께 볼 문항으로 표시</label>
  <textarea id="note" placeholder="${a.low?'어느 쪽과 헷갈렸는지 한 줄 적어 주세요':'메모 (선택)'}">${esc(a.note||'')}</textarea>
  ${a.low&&!(a.note||'').trim()?'<div class="warnbox">확신이 낮을 때는 이유를 한 줄 남겨 주세요. 갈린 문항을 볼 때 씁니다.</div>':''}</div>`;
 return `${nav}<section class="card">${t==='P'?paperBody(it,a,''):articleBody(it,a,'')}${extra}</section>${nav}`;
}
function practiceView(){
 const i=Math.min(state.idx.X,PRACTICE.length-1),it=PRACTICE[i],p=state.practice[it.id]||{},a=p.a||{};
 const nav=`<div class="navrow"><button class="btn" data-act="prev" ${i===0?'disabled':''}>← 이전</button><span class="pos">연습 ${i+1} / ${PRACTICE.length}</span><div class="progress"><i style="width:${(i+1)/PRACTICE.length*100}%"></i></div>
  <button class="btn primary" data-act="next" ${i===PRACTICE.length-1?'disabled':''}>다음 →</button></div>`;
 const ready=it.kind==='P'?doneP(a):doneA(a,it);let fb='';
 if(p.checked){
  const k=it.key,diff=[];
  if(it.kind==='P'){['a','b','c'].forEach((f,n)=>{if((k[f]||'')!==(a[f]||''))diff.push('①②③'[n])})}
  else{it.bundles.forEach(b=>{if(k.t[b.code]!==(a.t||{})[b.code])diff.push('주제')});if(k.ls!==a.ls)diff.push('연구 1단계');else if((k.sr||'')!==(a.sr||''))diff.push('연구 2단계')}
  fb=`<div class="fb ${diff.length?'bad':'ok'}"><b>${diff.length?'기준과 다른 답: '+esc(diff.join(', ')):'기준과 같은 답입니다'}</b><p>${esc(it.why)}</p></div>`;
 }
 return `<section class="card"><h2>연습 (가상의 예시)</h2><p class="muted">실제 기사·논문이 아니라 기준을 익히려고 만든 예시입니다. 답은 저장되지 않습니다.</p></section>${nav}
 <section class="card">${it.kind==='P'?paperBody(it,a,'x:'):articleBody(it,a,'x:')}
 <div class="navrow"><button class="btn primary" data-act="check" ${ready?'':'disabled'}>기준에 따른 답 보기</button></div>${fb}</section>${nav}`;
}

/* ---------- results ---------- */
function coders(){const c={};if(state.uid||Object.keys(state.answers).length)c[state.uid||'local']={slot:state.slot,answers:state.answers};Object.entries(state.others).forEach(([id,d])=>c[id]={slot:d.slot||0,answers:d.answers||{}});return c}
const nameOf=id=>id===state.uid||id==='local'?'나':state.names[id]||'팀원';
function results(){
 const C=coders(),ids=Object.keys(C);
 const prog=(id,t)=>{const s=C[id].slot,its=ITEMS[t].filter(it=>it.assign===0||it.assign===s);return `${its.filter(it=>done(t,C[id].answers[it.id]||{},it)).length}/${its.length}`};
 let h=`<section class="card"><h2>결과</h2><div class="tbl"><table><thead><tr><th>코더</th><th>번호</th><th>논문</th><th>기사</th></tr></thead><tbody>
  ${ids.map(id=>`<tr><td>${esc(nameOf(id))}</td><td class="num">${C[id].slot||'–'}</td><td class="num">${prog(id,'P')}</td><td class="num">${prog(id,'A')}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">일치도는 두 명 이상이 판정한 문항으로 계산합니다(Krippendorff α: .800 이상 채택, .667–.800 잠정). 컴퓨터 규칙과의 비교와 갈린 문항 목록은 내 몫을 다 끝내면 열립니다.</p></section>`;
 for(const t of ['P','A']){
  const complete=state.slot&&doneCount(t)===mine(t).length,canSee=complete||state.isOwner;
  h+=`<section class="card"><h3>${esc(NAME[t])}</h3>`;
  const der=(id,it)=>{const a=C[id].answers[it.id]||{};return t==='P'?derP(a):derA(a,it)};
  const fields=t==='P'?[['적격성',(d)=>[d.elig]],['역할 (주 분석/배경/해당 없음)',(d)=>[d.role]]]:[['주제 (기사×부작용)',null],['연구 보도 여부',(d)=>[d.research]],['분석 포함 여부 (주제 예 그리고 연구 보도 예)',(d)=>[d.include]]];
  fields.forEach(([label,f])=>{
   let units=[];
   if(f)units=ITEMS[t].map(it=>ids.map(id=>der(id,it)).filter(Boolean).map(d=>f(d)[0]));
   else ITEMS[t].forEach(it=>it.bundles.forEach(b=>units.push(ids.map(id=>der(id,it)).filter(Boolean).map(d=>d.topic[b.code]))));
   const k=krippAlpha(units);
   h+=`<p>${esc(label)}: α = <b>${f3(k.alpha)}</b> ${k.units?verdictAlpha(k.alpha):''} · 단순 일치율 ${pct(pairAgree(units))} · 문항 ${k.units}개</p>`;
  });
  if(!canSee){h+=`<p class="note">내 몫을 끝내면(${state.slot?doneCount(t)+'/'+mine(t).length:'번호 미선택'}) 아래가 열립니다.</p></section>`;continue}
  if(t==='A'){
   h+=`<div class="tbl"><table><thead><tr><th>코더</th><th>값</th><th>n</th><th>정밀도 (95% CI)</th><th>재현율 (95% CI)</th></tr></thead><tbody>`;
   ids.forEach(id=>{
    const tp=[],rs=[],inc=[];ITEMS.A.forEach(it=>{const d=der(id,it);if(!d)return;it.bundles.forEach(b=>tp.push([it.rule.fit[b.code]?'yes':'no',d.topic[b.code]]));rs.push([it.rule.research,d.research]);inc.push([it.rule_pass?'yes':'no',d.include])});
    [['주제',tp],['연구 보도',rs],['분석 포함',inc]].forEach(([lab,ps])=>{const s=binStats(ps);h+=`<tr><td>${esc(nameOf(id))}</td><td>${lab}</td><td class="num">${s.n}</td><td class="num">${pct(s.prec)} (${ci(s.precCI)}) ${verdictPR(s.prec)}</td><td class="num">${pct(s.rec)} (${ci(s.recCI)}) ${verdictPR(s.rec)}</td></tr>`})});
   h+=`</tbody></table></div><p class="note">컴퓨터 규칙이 "예"라고 한 것 가운데 사람도 "예"인 비율이 정밀도, 사람이 "예"라고 한 것 가운데 규칙도 "예"인 비율이 재현율입니다. 합격선은 둘 다 .80 초과입니다.</p>`;
  }else{
   const tally={};ITEMS.P.forEach(it=>{const ds=ids.map(id=>der(id,it)).filter(Boolean);if(!ds.length)return;const g=tally[it.group_ko]=tally[it.group_ko]||{n:0,main:0,background:0,none:0,split:0};g.n++;
    const roles=[...new Set(ds.map(d=>d.role))];if(roles.length>1)g.split++;else g[roles[0]]++});
   h+=`<div class="tbl"><table><thead><tr><th>묶음</th><th>판정된 논문</th><th>주 분석</th><th>배경</th><th>부적격</th><th>코더 간 갈림</th></tr></thead><tbody>${Object.entries(tally).map(([g,v])=>`<tr><td>${esc(g)}</td><td class="num">${v.n}</td><td class="num">${v.main}</td><td class="num">${v.background}</td><td class="num">${v.none}</td><td class="num">${v.split}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const rows=[];ITEMS[t].forEach(it=>{const per=ids.map(id=>[id,der(id,it),C[id].answers[it.id]||{}]).filter(x=>x[1]);if(per.length<2)return;
   const sig=d=>t==='P'?d.elig+'/'+d.role:Object.values(d.topic).join('')+'/'+d.research;
   if(new Set(per.map(x=>sig(x[1]))).size>1||per.some(x=>x[2].low))rows.push([it,per])});
  if(rows.length)h+=`<details><summary>함께 볼 문항 ${rows.length}건 (답이 갈렸거나 "확신 낮음")</summary><div class="tbl"><table><thead><tr><th>문항</th><th>코더별 답</th><th>메모</th></tr></thead><tbody>${rows.map(([it,per])=>`<tr><td>${esc(it.pmid||it.id)}<br><span class="muted">${esc(it.title.slice(0,60))}</span></td>
   <td>${per.map(([id,d,a])=>`${esc(nameOf(id))}: ${t==='P'?(d.elig==='yes'?'적격·'+(d.role==='main'?'주 분석':'배경'):'부적격')+` (${a.a||''}/${a.b||''}/${a.c||''})`:it.bundles.map(b=>(a.t||{})[b.code]).join(',')+' · 연구 '+(d.research==='yes'?'예':'아니오')+` (${a.ls}${a.sr?'/'+a.sr:''})`}${a.low?' ⚑':''}`).join('<br>')}</td>
   <td>${per.map(([id,d,a])=>a.note?esc(nameOf(id))+': '+esc(a.note):'').filter(Boolean).join('<br>')}</td></tr>`).join('')}</tbody></table></div></details>`;
  h+='</section>';
 }
 h+=`<section class="card"><h3>내보내기</h3><p class="muted">모든 코더의 원래 답, 기준에 따른 결과, 컴퓨터 규칙 판정을 CSV로 저장합니다.</p><div class="navrow"><button class="btn primary" data-act="export">CSV 내보내기</button></div><textarea id="exportbox" hidden readonly style="min-height:160px;font-family:var(--mono);font-size:12px"></textarea></section>`;
 return h;
}
function csv(){
 const C=coders(),rows=[['round','task','item_id','pmid_or_article_id','group','assign','coder','coder_slot','q_a','q_b','q_c','topic_raw','lead_study','study_role','broken','low_confidence','note','derived_eligible','derived_role','derived_topic','derived_research','derived_include','rule_fit','rule_research','rule_pass','title','url']];
 Object.entries(C).forEach(([cid,c])=>{
  D.papers.forEach(it=>{const a=c.answers[it.id];if(!a)return;const d=derP(a)||{};rows.push([3,'P',it.id,it.pmid,it.group,it.assign,cid,c.slot,a.a||'',a.b||'',a.c||'','','','','',a.low?1:'',a.note||'',d.elig||'',d.role||'','','','','','','',it.title,it.url])});
  D.articles.forEach(it=>{const a=c.answers[it.id];if(!a)return;const d=derA(a,it)||{};it.bundles.forEach(b=>rows.push([3,'A',it.id,it.article_id,b.code,it.assign,cid,c.slot,'','','',(a.t||{})[b.code]||'',a.ls||'',a.sr||'',a.broken?1:'',a.low?1:'',a.note||'','','',d.topic?d.topic[b.code]:'',d.research||'',d.include||'',it.rule.fit[b.code]?'yes':'no',it.rule.research,it.rule_pass?'yes':'no',it.title,it.url]))})});
 return '\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
}

/* ---------- events ---------- */
function current(){const t=state.tab;if(t==='X')return{it:PRACTICE[Math.min(state.idx.X,PRACTICE.length-1)],practice:true};const items=mine(t);return{it:items[Math.min(state.idx[t],items.length-1)]}}
function applyField(a,field,val){
 if(field.startsWith('t:')){a.t={...(a.t||{}),[field.slice(2)]:val}}else a[field]=val;
 if(field==='a'&&val==='no'){delete a.b;delete a.c}
 if(field==='b'&&val!=='yes')delete a.c;
 if(field==='ls'&&val==='no')delete a.sr;
 return a;
}
document.addEventListener('click',async e=>{
 const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();scrollTo(0,0);return}
 const sl=e.target.closest('[data-slot]');if(sl){state.slot=+sl.dataset.slot;state.idx.P=state.idx.A=0;scheduleSave();render();return}
 const o=e.target.closest('.opt[data-field]');if(o){
  const {it,practice}=current();let f=o.dataset.field;
  if(practice){f=f.replace(/^x:/,'');const p=state.practice[it.id]||{};state.practice[it.id]={a:applyField({...(p.a||{})},f,o.dataset.val),checked:false};render()}
  else{state.answers[it.id]=applyField({...ans(it.id)},f,o.dataset.val);scheduleSave();render()}
  return}
 const b=e.target.closest('[data-act]');if(!b)return;const t=state.tab,act=b.dataset.act;
 if(act==='prev'){state.idx[t]--;restOpen=false;render();scrollTo(0,0)}
 if(act==='next'){state.idx[t]++;restOpen=false;render();scrollTo(0,0)}
 if(act==='check'){const {it}=current();state.practice[it.id]={...(state.practice[it.id]||{}),checked:true};render()}
 if(act==='jump'){const items=mine(t),n=items.length;for(let k=1;k<=n;k++){const j=(state.idx[t]+k)%n;if(!done(t,ans(items[j].id),items[j])){state.idx[t]=j;break}}render();scrollTo(0,0)}
 if(act==='export'){
  const data=csv(),dl=window.claude&&claude.use?await claude.use('downloads'):null;
  if(dl){try{await dl.save({filename:'validation_codes_round3.csv',data});return}catch(err){}}
  const box=$('#exportbox');box.hidden=false;box.value=data;box.select();
  try{await navigator.clipboard.writeText(data);b.textContent='클립보드에 복사됨'}catch(err){b.textContent='아래 칸을 복사하세요'}
 }
});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.flag;if(!f||state.tab==='X')return;const {it}=current();setAns(it.id,{[f]:e.target.checked})});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('restbox'))restOpen=e.target.open},true);
let noteTimer;document.addEventListener('input',e=>{if(e.target.id==='note'&&state.tab!=='X'){const {it}=current();state.answers[it.id]={...ans(it.id),note:e.target.value};clearTimeout(noteTimer);noteTimer=setTimeout(scheduleSave,400)}});
document.addEventListener('keydown',e=>{
 if(!['P','A','X'].includes(state.tab)||/TEXTAREA|SELECT|INPUT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
 const t=state.tab,n=t==='X'?PRACTICE.length:mine(t).length;
 if(e.key==='ArrowRight'&&state.idx[t]<n-1){state.idx[t]++;render();scrollTo(0,0)}
 else if(e.key==='ArrowLeft'&&state.idx[t]>0){state.idx[t]--;render();scrollTo(0,0)}
});
init();
</script>
</html>
