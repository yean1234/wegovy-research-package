# =====================================================================
# 한국어 규칙 기반 사전 v2 — 위고비(세마글루타이드) 부작용 4개 묶음용
#
# 논문 초록(한국어 번역) / 기사 본문 / 기사 제목 세 집단에 '같은 사전'을 적용한다.
# 선행 사전(TextMining-med-claim-trace 의 config/lexicon_ko.yaml)을 바탕으로 고쳤다.
# 무엇을 왜 고쳤는지는 docs/lexicon_changes.md 에 있다. 이 사전을 읽는 코드는
# scripts/claims.py 하나다.
#
# 항목 문법 (선행 사전과 같다)
#   일반 문자열      → 부분 문자열 일치 (대소문자 무시)
#   're:<정규식>'    → 정규식 일치. YAML 작은따옴표 안에서는 \ 를 그대로 쓴다.
# v2 에서 더한 것
#   {이름}           → 아래 macros 의 값으로 바뀐다 (정규식 항목 안에서만).
#                      {0,8} 같은 정규식 수량자는 건드리지 않는다.
# =====================================================================
version: 2

macros:
  # '위험을 높인다'처럼 방향 동사(높이다·늘리다·증가하다…)가 무엇에 대한 말인지 확인할 때 쓰는 명사.
  # '체중을 줄인다', '사용량이 증가했다'가 주장 단서로 잡히지 않게 한다.
  RISK: '(?:위험(?:성|도|률)?|리스크|발생률|발병률|유병률|진단률|보고율|빈도|발생|발병)'
  # 가능성·확률은 방향 동사의 목적어일 때만 위험 명사처럼 다룬다 ('가능성을 높인다')
  RISKP: '(?:{RISK}|가능성|확률)'
  # 부작용 사건을 가리키는 명사 ('췌장염이 생길 수 있다', '실명으로 이어진다')
  EVENT: '(?:췌장염|염증|마비|무력증|시신경\s*병?증|시신경염|시신경\s*(?:손상|질환)|NAION|실명|시력\s*(?:상실|손실|저하|손상)|충동|생각|사고|행동|시도|부작용|이상\s*(?:반응|사례)|증상|질환|합병증|문제)'
  # 인과 동사의 목적어가 될 수 있는 명사: 부작용 사건, 위험 명사, 병명처럼 생긴 말(-염, -증, -병 …)
  OBJ: '(?:{EVENT}|{RISKP}|[가-힣A-Za-z]+(?:염|증|병|폐색|장애|손상))'
  # 명사 뒤에 붙는 괄호 설명·닫는 따옴표 ('NAION(비동맥염성 …)', ''자살 충동'')
  POST: '(?:\s*\([^)]{0,60}\)|[)''"’”」』])*'
  # 조사 (없어도 된다)
  J: '(?:[이가은는도을를])?'
  # 비교 대상 ('비투여군보다', '다른 약물에 비해')
  CMP: '(?:(?:[^\s,.]+\s+){0,3}?[^\s,.]*(?:보다|에\s*비해|대비)\s*)'
  # 정도·수량 표현 ('2배 이상', '유의하게', '약 두 배로')
  AMT: '(?:(?:약|최대|최소|무려|거의|더|더욱|훨씬|크게|대폭|확|다소|약간|소폭|오히려|유의하게|유의미하게|현저히|통계적으로|두|세|네|[\d.,~\-]+)\s*(?:배|%p|%|퍼센트)?(?:로|나)?(?:\s*(?:이상|가량|정도|넘게|까지|가까이))?\s*){0,4}'
  # 숫자가 반드시 들어간 수량 ('4배 이상', '약 45% 더')
  NUM: '(?:(?:약|최대|최소|무려|거의)\s*)?(?:[\d.,~\-]+|두|세|네|수)\s*(?:배|%p|%|퍼센트)(?:로|나)?(?:\s*(?:이상|가량|정도|넘게|까지|가까이))?\s*(?:더\s*)?'
  # 목적어와 동사 사이에 올 수 있는 것: 비교 대상 + 수량
  Q: '{CMP}?{AMT}'
  # '~ 때문', '~ 탓', '~(으)로 인한' 앞에 와야 하는 약물·노출 표현
  DRUGN: '(?:위고비|세마글루[타티]이?드|오젬픽|리벨서스|약물?|약품|주사제?|치료제|복용|투여|투약|사용|성분)'

# --- 주장 문장 필터 ---------------------------------------------------------------------
# 약물 단서 AND 그 묶음의 부작용 단서가 '같은 문장'에 있을 때만 주장 문장으로 센다.
drug_terms:
  - 위고비
  - 're:세마글루[타티]이?드'        # 세마글루타이드 / 세마글루티드
  - Wegovy
  - semaglutide
  - 오젬픽
  - Ozempic
  - 리벨서스
  - Rybelsus

# 일반어. 기본 필터에서는 쓰지 않는다 (broad_drug=True 일 때만).
drug_terms_broad:
  - 're:GLP[-\s]?1'
  - 비만치료제
  - 're:비만\s*치료제'
  - 비만약
  - 're:비만\s*약(?![가-힣])'
  - 당뇨약
  - 're:당뇨병?\s*(치료제|약(?![가-힣]))'
  - 're:다이어트\s*(약(?![가-힣])|주사)'

# 묶음별 부작용 단서. scripts/label_articles.py 의 TOPIC 정규식과 같은 패턴이다.
outcome_terms:
  NAION:
    - 're:NAION|비동맥.{0,18}(?:시신경|허혈)|허혈성.{0,8}시신경'
  GASTROPARESIS:
    - 're:위\s*마비|위장?\s*무력증|gastroparesis'
  PANCREATITIS:
    - 're:췌장염|pancreatitis'
  SUICIDALITY:
    - 're:자살|자해|suicid'

# 넓은 부작용 단서. 기본 필터에서는 쓰지 않는다 (broad_outcome=True 일 때만 위 목록에 더한다).
outcome_terms_broad:
  NAION:
    - 시신경
    - 실명
    - 're:시력\s*상실'

# --- 관계 표현의 강도: 4범주 ---------------------------------------------------------------
# 한 문장에 단서가 여럿이면 부정·조정 규칙을 먼저 적용한 뒤
# direct > possible > association > none 순으로 가장 강한 것을 문장의 값으로 쓴다.
claim_strength:
  # 직접 인과. 뒤에 '수 있'·'가능성' 등이 같은 절에 있으면 possible 로 낮춘다 (modal_after).
  direct:
    # 인과 동사: 목적어가 부작용·질환·위험 명사이거나 바로 앞이 약물일 때만 ('췌장염을 유발', '위고비가 유발한').
    # '복통을 유발하는 췌장염'(질환의 증상 설명), '실명을 유발하는 시신경 질환'(질환을 꾸미는 말),
    # '유발할 위험'(위험 명사를 꾸미는 말)은 뺀다.
    - 're:(?:{OBJ}{POST}{J}|{DRUGN}{J})\s*(?:[^\s,.]{1,6}\s+)?(?:유발|초래|야기|촉발|(?:불러\s*)?일으(?:키|킨|켜|켰|킬)|부추(?:기|긴|겨|겼|길))(?!(?:하는|는|할\s*수\s*있는|\s*수\s*있는)\s+(?:\S+\s+){0,2}?\S*(?:질환|질병|병증))(?!할?\s*(?:위험|확률))'
    - 're:원인(?:이다|이라|으로|일|임|인\s*것|이\s*(?:된|될|되))'
    - 're:{DRUGN}\s*(?:때문|탓)'
    - 're:{DRUGN}(?:으로|로)\s*인(?:한|해|하여)'
    - 're:(?<!라고 )(?<!라 )(?<![가-힣])부(?:른다|르는|를(?=\s*수))'
    - 're:영향을?\s*(?:미치|미친|미쳤|미칠|준다|주는|줬|줄(?![가-힣])|끼치|끼친|끼쳤|끼칠)'
    # 방향 동사(타동): 위험·발생 등 목적어가 붙어 있을 때만
    - 're:(?:{RISKP}|{EVENT}){J}\s*{Q}(?:높(?:이[는고며다지기]|인다|인|여|였|일|입)|늘(?:리|린|려|렸|릴)|키(?:우|운|워|웠|울)|(?:증가|상승|악화|가중)시(?:키|킨|켜|켰|킬))'
    - 're:(?:{RISKP}|{EVENT}){J}\s*{Q}(?:낮(?:추|춘|춰|췄|출)|줄(?:이[는고며다지기]|인다|인|여|였|일)|(?:감소|저하)시(?:키|킨|켜|켰|킬))'
    # 일반 진술(현재·미래형 자동사): '맞으면 위험이 높아진다'. 과거형('높아졌다')은 association.
    - 're:(?:{RISKP}|{EVENT}){J}\s*{Q}(?:(?:높아|커|낮아)(?:진다|지는|질|지게|져(?![가-힣]))|(?:증가|상승|감소)(?:한다|하는|할|하게)|(?:늘어|줄어)(?:난다|나는|날|든다|드는|들))'
    # 부작용 사건이 생긴다는 일반 진술: '췌장염이 생길 (수 있다)'. '걸릴 위험'처럼 위험 명사를 꾸미면 뺀다.
    - 're:{EVENT}{J}\s*(?:생긴다|생길|생기게|걸린다|걸릴|걸리게|나타난다|나타날|발생한다|발생할|발생하게|겪는다|겪을|겪게|온다|올(?=\s*수))(?!\s*(?:위험|가능성|확률|우려))'
    - 're:{EVENT}(?:으로|로)\s*이어(?:진다|질|져(?![가-힣])|지는)'
    - 're:(?:실명|자살|자해)(?:한다|하게\s*(?:된다|만든다|한다)|할(?=\s*수\s*(?:도\s*)?있))'
    - 're:시력을?\s*잃(?:는다|을(?!\s*(?:위험|가능성|확률))|게)'
  # 가능성: 관계가 있을 수 있다고만 말한다
  possible:
    - 가능성
    - 우려
    # '췌장염이 의심되면 중단', 'NAION 의심 사례'는 진단상의 의심이므로 뺀다
    - 're:의심(?!\s*(?:사례|환자|증상|소견|증세))(?!되면|될\s*경우|되는\s*(?:경우|이상\s*사례|환자))'
    - 의혹
    - 're:수도\s*있'
    - 're:지도\s*모[르른를]'
    - 're:시사(?:한|하|했|됐|된|되)'
    - 're:것으로\s*(?:보인|보여|보였|보이|추정|추측|예상)'
    - 're:추정(?:된|되|됐|한|했)'
    - 're:(?:위험|위험성|리스크)(?:이|도)?\s*있(?!는\s*(?:환자|사람|이들|대상|군|집단))'
    - 're:(?:위험|위험성)[을를이가]?\s*(?:\S{1,4}\s+)?제기'
    - 're:(?:위험|안전성|이상)\s*신호'
    - 're:(?<=[은는을일할킬될])\s*듯'
    - 're:것\s*같'
    # '인과관계는 불분명하다 / 입증되지 않았다 / 증명하지는 못했다': 관계를 부정하지 않고 열어 둔다
    - 're:인과\s*관계[는가도를]?\s*.{0,8}(?:불분명|불확실|회의|(?:확실|명확|분명)하지\s*않|(?:입증|증명|규명|확인|확립|밝혀|밝히)\S{0,4}\s*(?:않|못|없))'
  # 연관: 같이 나타난다는 관찰, 방향 없는 관계
  association:
    - 연관
    - 're:상관\s*(?:관계|성)'
    - 're:관련(?:성|이?\s*있|돼|된|됐|되)'
    - 're:관계(?:가|를)?\s*(?:있|보|맺)'
    - 're:연결(?:돼|된|됐|되|고리)'
    - 경향
    # 과거형 관찰 서술
    - 're:(?:높|많|컸|크|낮|적)았'
    - 're:(?:높|많|낮|적)은\s*것으로'
    - 're:(?:높|많|낮|적)게\s*나타(?:났|난|나)'
    - 're:(?:높|많|낮|적)음(?:을|이)'
    # 자동사 과거형은 위험·부작용 명사가 주어일 때만 ('사용량이 증가했다'는 뺀다). 사이에 어절 4개까지 허용.
    - 're:(?:{RISK}|{EVENT}){J}\s*(?:[^\s,.]+\s+){0,4}?(?:(?:증가|상승|감소|하락)(?:했|하였|됐|되었|한\s*것으로)|(?:높아|커|낮아)졌|늘었|늘어났|줄었|줄어들었)'
    # 현재형 비교 서술: '위험이 2배 높다'. '가능성이 높다'(= 그럴 법하다)는 possible 이므로
    # 가능성·확률은 비교 대상이나 숫자가 있을 때만 여기로 온다 ('가능성이 미복용자보다 4배 높았다').
    - 're:{RISK}{J}\s*{Q}(?:높|크|많|낮|적|작)(?:다|으며|고\s)'
    - 're:(?:가능성|확률){J}\s*(?:{CMP}{AMT}|{NUM})(?:높|크|컸|많|낮|적|작)'
    # 위험 증가 명사구 ('위험 증가', '위험 2배')
    - 're:(?:위험|위험도|위험성|발병률|발생률)\s*(?:증가|상승|↑)(?!\s*(?:시키|시킨|시켜|시켰|시킬|했|한다|해|하는|할|하게))'
    - 're:(?:위험|위험도|위험성|발병률|발생률)[이가은는도]?\s*(?:약\s*|최대\s*)?\d+(?:\.\d+)?\s*배'
    # 관찰·보고의 틀
    - 're:관찰(?:되|됐|된|됨)'
    - 're:것으로\s*나타(?:났|난|나)'
    - 're:보고(?:됐|되었|된\s*바|되면서|되고\s*있)'
  # 무관: 관계가 없다고 명시
  none:
    - 're:(?:연관|관련|관계|상관)(?:성|관계)?[이은는도]?\s*(?:전혀\s*)?(?:없|않)'
    - 're:(?:연관|관련|상관)성[은는이가도]?\s*(?:\S+\s+){0,2}?(?:높|크|뚜렷하|분명하|강하)지\s*(?:는|도)?\s*않'
    - 're:인과(?:성|\s*관계)[을를은는이가도에]?\s*(?:못\s*찾|없|아니|아냐)'
    - 're:(?:연관|관련|관계|상관)(?:성|관계)?[을를]\s*(?:발견|확인|찾)\S{0,3}\s*(?:못|않)'
    - 're:무관(?!하게|심)'
    - 're:상관없(?!이)'
    - 're:영향(?:이|을|은)?\s*(?:없|주지\s*않|미치지\s*않|끼치지\s*않)'
    - 're:차이(?:가|는|도)?\s*(?:없|나지\s*않|보이지\s*않|크지\s*않)'
    - 're:유의(?:미)?하지\s*않'
    - 're:유의(?:미)?한\s*(?:차이|증가|연관성?|관련성?|상관관계)[은는가이도]?\s*없'
    - 're:(?:높|많|크)지\s*(?:는|도)?\s*않'
    - 're:(?:증가|상승)(?:하지|되지)\s*(?:는|도)?\s*않'
    - 're:(?:{RISKP}|{EVENT}){J}\s*{Q}(?:안|못)\s*(?:높|늘|키|증가|일으|유발)'
    - 're:근거(?:가|는)?\s*없'
    - 're:(?:우려|예상|통념)[와과]\s*(?:달리|다르게)'
    - 괴담
    - 누명
    - 사실무근
    - 're:사실(?:이)?\s*(?:아니|아냐)'
    - 're:안전(?:하다|해(?![가-힣])|한\s*것으로)'

# 감싸는 틀(frame) 단서: 스스로 관계를 말하지 않고 앞의 명제를 감싼다 ('~것으로 나타났다', '~을 시사한다').
# 같은 절에서 앞선 단서가 none(부정 포함)이면 이 단서도 none 으로 본다.
#   "위험을 증가시키지 않음을 시사한다" → none (possible 이 아님)
#   "췌장염과 무관한 것으로 나타났다"   → none (association 이 아님)
frame_cues:
  - 're:^시사'
  - 're:^것으로'
  - 're:^추정'
  - 가능성
  - 우려
  - 의심
  - 의혹
  - 're:^수도'
  - 're:^지도'
  - 're:듯$'
  - 're:^것\s*같'
  - 're:^관찰'
  - 're:^보고'
  - 경향

# 논항(argument) 단서: '위험 증가', '위험 2배' 같은 명사구는 뒤따르는 서술어의 논항이다.
# 같은 절에서 뒤에 오는 단서가 none(부정 포함)이면 이 단서도 none 으로 본다.
#   "위험 증가와 연관되지 않았다", "위험 증가와 관련이 없었다" → none (association 이 아님)
argument_cues:
  - 're:(?:증가|상승|↑)$'
  - 're:\d\s*배$'

# direct 단서 뒤, 같은 절 안에 이 표현이 있으면 possible 로 낮춘다.
modal_after: '수\s*(?:도|는)?\s*있|가능성|우려|의심|의혹|논란|지도\s*모[르른를]|것으로\s*(?:보인|보여|보였|보이|추정|추측|예상)|시사|추정|(?<=[은는을일할킬될])\s*듯|것\s*같|가설'

# 간접 의문('높이는지 조사했다', '유발 여부')은 주장이 아니므로 그 단서는 세지 않는다.
# 단서가 든 어절의 나머지 + 다음 어절에서 찾는다.
indirect_question: '(?:는지|은지|인지|[일할킬될을울릴칠질길줄올날]지|느냐|는가)(?:[는를에가도]|에\s*대해서?|에\s*관해)?[,.?]?(?:\s|$)|(?:^|\s)여부'

# 탐구 서술('연관성을 분석했다', '가능성을 조사하기 위해')도 주장이 아니므로 그 단서는 세지 않는다.
# 초록의 목적 문장에 흔하다. 단서가 든 어절의 나머지 + 다음 어절 2개에서 찾는다.
inquiry_after: '^(?:성|관계)?(?:을|를|에\s*대해서?|에\s*대한|에\s*관한|\s*여부)\S*\s*(?:\S+\s+)?\S*(?:분석|조사|평가|검토|탐색|규명|살펴|알아보|확인하기|확인하고자|밝히기|밝히고자|연구했|연구하였)'

# --- 부정 규칙 ------------------------------------------------------------------------------
negation:
  # 절 경계. 부정·양태의 범위는 '단서 끝 ~ 그 절의 끝'이다. (NFKC 정규화 뒤 '…'는 '...'가 된다)
  clause_boundary: '[,;:]|\.{2,}|\s[-–—]\s|지만|(?<=[았었였했됐])으나|(?<=[가-힣])으나\s|는데|은데|인데\s|면서|(?<=[가-힣])며\s|반면|그러나|하지만|다만|(?<=다)\s*[.!?]\s'
  # (가) 단서 바로 뒤: 단서가 든 어절의 나머지 + 다음 어절 N개 안의 부정 → none
  #      '유발하지 않는다', '높이지는 않았다', '원인이 아니다', '위험 증가 없이'
  after_cue_eojeols: 1
  after_cue: '지\s*(?:는|도|가|만|를)?\s*(?:않|못)|(?<![가-힣])않|없|아니(?!면)|아냐|아님|아닌|못\s*(?:하|했|한)|무관|커녕|(?:^|\s)안(?:\s|$)'
  # (나) 단서 바로 앞의 짧은 부정: '안 높여', '못 막아'
  before_cue: '(?:^|\s)(?:안|못)\s*$'
  # (다) 절 끝 부정: 단서가 들어 있는 내포절을 부정하는 서술어 → none
  #      '~다는 근거는 없다', '~것으로 보이지(는) 않는다', '~은 발견되지 않았다', '~는 것은 아니다'
  clause_final:
    - 're:(?:근거|증거|징후|연구\s*결과|데이터|자료|보고|사례)[는가도]?\s*(?:아직\s*|현재\s*|현재까지\s*|전혀\s*)?없'
    - 're:(?:결과|결론|근거|증거|징후)[는가도]?\s*나오지\s*않'
    - 're:(?:오명|누명|의혹|혐의)[을를은는]?\s*(?:벗|씻|털)'
    - 're:보이지(?:는|도)?\s*않'
    - 're:(?:발견|확인|관찰|보고|검출|감지)되지(?:는|도)?\s*않'
    - 're:나타나지(?:는|도)?\s*않'
    - 're:지\s*않음'
    - 're:(?:것|건)(?:은|이)?\s*아니'
    - 're:(?:뜻|의미)[은는가이]?\s*아니'
    - 're:(?:볼|말할|결론\s*내릴)\s*수(?:는)?\s*없'
    - 're:보기(?:는|엔|에는)?\s*어렵'
    - 're:(?:뒷받침|지지)(?:하지|되지)(?:는)?\s*않'
    - 're:사실(?:이|은)?\s*(?:아니|아냐)'
    - 사실무근
  # (라) 단정 유보: 관계를 부정하지 않고 '확정할 수 없다'고만 말한다 → none 이 아니라 possible
  #      direct 단서, 그리고 부정된 단서('유발하지 않는다고 단정할 수 없다')에 적용한다.
  non_assertion:
    - 're:단정(?:할|지을)\s*수(?:는)?\s*없'
    - 're:단정(?:하기|짓기)(?:는|엔|에는)?\s*(?:어렵|힘들|이르)'
    - 're:단정해서는'
    - 're:단언(?:할\s*수(?:는)?\s*없|하기(?:는)?\s*어렵)'
    - 're:결론(?:을|은)?\s*(?:내리기|짓기)(?:는|엔|에는)?\s*(?:어렵|이르)'
    - 're:(?:입증|증명|규명|확립|검증)되지(?:는|도)?\s*않'
    # '~라는 결과가 인과관계를 입증한 것은 아니다': '것은 아니'가 (다)에 걸리지만 관계 부정이 아니다
    - 're:인과\s*관계[를는가]?\s*.{0,8}(?:입증|증명|규명|확정|밝)\S{0,6}\s*(?:것은?\s*)?(?:아니|않|못|없)'
    - 're:밝혀지지(?:는|도)?\s*않'
    - 're:(?:확실|분명|명확)(?:하지|치)(?:는)?\s*않'
    - 불분명
    - 불확실
    - 미지수
    - 're:알\s*수\s*없'
    - 're:(?:근거|증거)[는가도]?\s*(?:아직\s*)?(?:부족|불충분|미흡|제한적)'

# --- 조건 표현 (RQ2): 5범주 ------------------------------------------------------------------
conditions:
  # 대상: '누구에게서'를 좁히는 한정 표현만. 맨몸의 환자·당뇨·비만·과체중·성인·참가자·대상자는 뺐다
  # (위고비 기사라면 거의 모두 나오므로 조건 전달 여부를 가르지 못한다).
  population:
    - 're:\d+\s*세(?!대|기)\s*(?:이상|이하|미만|초과|부터|~)?'
    - 're:\d+\s*[~\-]\s*\d+\s*세(?!대|기)'
    - 고령
    - 노인
    - 노년
    - 중장년
    - 어린이
    - 아동
    - 소아
    - 청소년
    - 영유아
    - 're:임(?:신|산)부'
    - 산모
    - 're:임신\s*중'
    - 가임기
    - 're:(?<![가-힣])(?:남|여)성'
    - 비당뇨
    - 're:당뇨병?(?:이|가)?\s*없는'
    # '제2형 당뇨병 치료제 오젬픽'은 약의 적응증 소개이지 연구 대상 한정이 아니므로 뺀다
    - 're:제?\s*[12]\s*형\s*당뇨(?!병?\s*(?:치료제|치료\s*약|치료용|약(?![가-힣])|신약))병?'
    - 're:(?:병력|과거력|기저\s*질환)'
    - 고위험군
    - 're:(?:한국|아시아|동양|서양)인|백인|흑인'
  dose:
    - 're:\d+(?:\.\d+)?\s*(?:mg|㎎|밀리그램|μg|mcg|IU)'
    - 용량
    - 투여량
  duration:
    - 're:(?<![\d.])\d{1,2}(?:\.\d+)?\s*년\s*(?:이상|이하|간|동안|넘|초과|미만|가량|여|째)'
    - 're:(?<![\d.])\d{1,3}\s*개월'
    - 're:(?<![\d.])\d{1,3}\s*주\s*(?:이상|간|동안|째)'
    # '장기'는 臟器(장기 손상)와 구분되지 않으므로 기간 뜻이 분명한 형태로만 잡는다
    - 're:장기간|장기적|장기\s*(?:복용|투여|투약|사용|처방|치료|추적|관찰|연구|노출|안전성|데이터|효과)'
    - 're:단기간|단기적|단기\s*(?:복용|투여|투약|사용|처방|치료|추적|관찰|연구|노출)'
    - 're:누적\s*(?:용량|복용|투여|사용|노출|기간)'
    - 're:추적\s*(?:관찰|기간|조사|연구|결과)|추적한|추적했'
    - 're:오랫?동안'
  design:
    - 코호트
    - 're:관찰\s*연구'
    - 후향
    - 전향
    - 무작위
    - 're:(?<![A-Za-z])RCT(?![A-Za-z])'
    - 임상시험
    - 're:임상\s*시험'
    - 위약
    - 're:이중\s*맹검'
    - 메타분석
    - 're:메타\s*분석'
    - 're:체계적\s*(?:문헌|고찰)'
    - 're:(?:환자|사례)[\s-]*대조군?\s*연구'
    - 're:(?:증례|사례)\s*(?:보고|연구)'
    - 're:단일\s*기관'
    - 데이터베이스
    - 빅데이터
    - 건강보험
    - 전자의무기록
    - 're:(?:부작용|이상\s*사례)\s*보고\s*(?:시스템|체계|자료|데이터)'
    - 're:(?<![A-Za-z])FAERS(?![A-Za-z])'
    - 약물감시
    - 're:실제\s*(?:임상|진료)\s*(?:자료|데이터)|리얼\s*월드'
    - 설문
    - 매칭
  limitation:
    # '인과관계가 없다'(무관 결과 자체)는 한계 문장이 아니다 → 입증·확정·설명 '못한다'류만
    - 're:인과\s*관계[는를가이도은]?\s*.{0,8}(입증|증명|확정|규명|설명|단정|의미|확인|밝히|말해주)[^.]{0,10}(않|없|못|어렵|아니)'
    - 're:인과\s*관계[는를가이도은]?\s*.{0,15}연구가?\s*필요'
    - 're:인과\s*관계[^.]{0,6}(불분명|불확실|밝혀지지|확실하지)'
    - 're:(추가|후속|더 많은)(적인|적)?\s*(연구|조사|검증)'
    - 한계
    - 're:단정(할 수 없|하기 어렵|짓기 어렵|할 순 없|해서는)'
    - 're:해석에?\s*(주의|신중)'
    - 're:(해석|받아들여)(해서는|하면)\s*안'
    - 확대 해석
    - 're:일반화(하기|할 수)'
    - 're:(그대로|즉각|바로)\s*적용(할|하기)?\s*(수(는|가)?\s*없|어렵|에는)'
    - 're:적용(하기)?(에는|은|는)?\s*(무리|어렵)'
    - 're:(임의로|함부로|섣불리)\s*(중단|끊)'
    - 're:(의미|뜻)(는|이)?\s*아니'
    - 're:(의미|뜻)하(지|는 것은)\s*(는\s*)?않'
    # '교란 요인을 통제했다'(방법 설명)는 제외
    - 're:교란\s*(요인|변수)(?![^.]{0,20}(통제|조정|보정|배제))'
    - 're:연관성(만|일 뿐)'
    - 're:(시사|보여줄)할?\s*뿐'

# 기본 집계에서 빼는 조건 범주 (선행 사전에 있던 것. 필요하면 include_extra=True 로 본다)
extra_conditions:
  animal:
    - 생쥐
    - 're:(?<![가-힣])쥐(?!어|고|며)'
    - 마우스
    - 동물
    - 실험용
    - 세포
    - 원숭이
    - 영장류
    - 초파리
  sample_size:
    - 're:\d[\d,\.]*\s*(만\s*)?(천\s*)?\s*명'
    - 're:\d[\d,]*\s*쌍'
    - 're:\d[\d,\.]*\s*만\s*건'
  effect_size:
    - 're:(?<![A-Za-z])(HR|OR|RR|aHR|aOR)(?![A-Za-z])'
    - 위험비
    - 오즈비
    - 상대위험
    - 신뢰구간
    - 're:\d+(\.\d+)?\s*배'
    - 're:\d+(\.\d+)?\s*%'

# --- 불확실성(hedge) / 확실성 강화(booster) ---------------------------------------------------
# 두 목록이 겹치는 문제('불확실' 안의 '확실', '입증되지 않았다'의 '입증')는 사전이 아니라
# scripts/claims.py 가 푼다: booster 일치가 hedge 일치와 겹치거나, 바로 뒤 window 글자 안에
# booster_negation 이 오면 booster 에서 빼고 hedge 로 센다.
hedges:
  - 가능성
  - 're:수\s*있'
  - 're:수도'
  - 're:것으로\s*(보인|보여|보였|추정|추측)'
  - 추정
  - 're:시사(?:한|하|했|됐|된|되)'
  - 아직
  - 're:(확인|밝혀|입증|규명)되지\s*않'
  - 're:명확(하지|치)\s*않'
  - 불분명
  - 불확실
  - 논란
  - 여지
  - 're:단정(할 수 없|하기 어렵)'
  - 're:(추가|후속)\s*연구'
  - 회의적

boosters:
  - 're:확인(됐|되었|돼)'
  - 입증
  - 're:밝혀(졌|냈)'
  - 드러났
  - 증명
  - 확실
  - 반드시
  - 무조건
  - 명백
  - 결정적
  - 're:(?<!성)분명'      # '성분명 세마글루타이드'의 '분명'은 뺀다
  - '100%'

# window: booster 끝에서 이 글자 수 안에서 부정이 '시작'되면 hedge 로 센다 (쉼표·마침표에서 끊는다).
#   6 이면 '입증하는 것은 아니다'(부정이 7번째 글자에서 시작)를 놓쳐서 8 로 두었다.
booster_negation:
  window: 8
  pattern: '지\s*(?:는|도)?\s*않|치\s*않|않|없|못|아니|어렵'
